name: Build and Release P4 Firmware

on:
  # 推送 v 开头的标签（如 v3.35.3）时自动编译并发布 Release
  push:
    tags:
      - 'v*'
  # 支持在 Actions 页面手动点击运行，用于发版前测试
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 脚本编译中文版时需要调用 python 运行 tools/prepare_chinese_build.py
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        shell: pwsh
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          # 如果项目需要额外的第三方库（不在仓库 third_party/vendor 内），取消下一行注释并填写库名：
          # arduino-cli lib install "ArduinoJson"

      - name: Compile all P4 variants
        shell: pwsh
        run: |
          .\Compile-P4-Variants.ps1

      # 若编译失败，脚本会保留 build_variants，这里自动上传 compile.log 方便排查
      - name: Upload compile logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compile-logs
          path: build_variants/**/compile.log
          if-no-files-found: ignore

      # 额外打包一份全量 zip，方便用户一次性下载
      - name: Package zip bundle
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "dev-build" }
          Compress-Archive -Path ".\Final-Build\*" -DestinationPath "P4-CAN-Universal-$tag-All.zip" -Force

      # 每次运行都在 Actions 页面留存产物，手动测试时可直接下载验证
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: P4-Final-Build
          path: |
            Final-Build/*.bin
            P4-CAN-Universal-*-All.zip

      # 仅在打 v* 标签时自动创建 Release，同时附上 8 个独立 .bin 文件和 1 个汇总 zip
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Final-Build/*.bin
            P4-CAN-Universal-*-All.zip
