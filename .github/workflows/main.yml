name: Build and Release P4 Firmware

on:
  # 推送 v 开头的标签（如 v3.35.3）时自动编译并创建 Release
  push:
    tags:
      - 'v*'
  # 支持在 Actions 页面手动点击运行测试
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 如果 Compile-P4-Variants.ps1 使用 arduino-cli，保留此步骤；
      # 若脚本会自动安装或使用 PlatformIO，则需按脚本内容替换
      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 board core
        shell: pwsh
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Run build script
        shell: pwsh
        run: |
          .\Compile-P4-Variants.ps1

      # 将编译输出目录打包为 zip（请将下方路径改为脚本实际的导出目录）
      - name: Package firmware artifacts
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "dev-build" }
          Compress-Archive -Path ".\build\*" -DestinationPath "P4-CAN-Universal-$tag.zip" -Force

      # 手动运行和打标签时都会保存构建产物，方便直接在 Actions 页面下载测试
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: p4-firmware-package
          path: P4-CAN-Universal-*.zip

      # 仅在推送 v* 标签时自动生成 Release 并挂载压缩包
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            P4-CAN-Universal-*.zip
